[package]
name = "handoff-ledger"
version = "0.1.0"
edition = "2021"
description = "A serializable, provenance-carrying handoff protocol for multi-agent / multi-worktree development."
license = "MIT"
repository = "https://github.com/flashesofbrilliance/handoff-ledger"
readme = "README.md"

# Zero dependencies by design: a tiny hand-rolled JSON parser keeps the binary small,
# the build offline-capable, and the supply chain trivial to audit/sign.
[dependencies]

[[bin]]
name = "handoff-ledger"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
