name: Release (signed)

# Produces SIGNED artifacts. The MAINTAINER triggers this and holds ALL secrets.
# germinate prepares the workflow; it never bundles or handles your keys/tokens.
#
# Required repo secrets (the maintainer sets these — Claude never touches them):
#   NPM_TOKEN            — npm automation token with publish rights (provenance uses OIDC, no extra key)
# Signing that needs NO stored secret:
#   - npm provenance     — via `--provenance` + the workflow's OIDC `id-token: write` permission
#   - cosign keyless      — via sigstore OIDC (the workflow identity), no private key stored
#
# This workflow runs ONLY on a pushed tag `v*` AND is gated on a manual approval
# environment, so nothing publishes without an explicit human release step.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the GitHub Release + upload assets
  id-token: write      # OIDC for npm provenance + cosign keyless signing

jobs:
  build-binaries:
    name: build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release binary
        run: cd packages/rust && rustup target add ${{ matrix.target }} && cargo build --release --target ${{ matrix.target }}
      - name: Package + checksum
        run: |
          cd packages/rust/target/${{ matrix.target }}/release
          tar czf germinate-${{ matrix.target }}.tar.gz germinate
          shasum -a 256 germinate-${{ matrix.target }}.tar.gz > germinate-${{ matrix.target }}.tar.gz.sha256
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the tarball (keyless / sigstore OIDC — no stored key)
        run: |
          cd packages/rust/target/${{ matrix.target }}/release
          COSIGN_EXPERIMENTAL=1 cosign sign-blob --yes \
            --output-signature germinate-${{ matrix.target }}.tar.gz.sig \
            --output-certificate germinate-${{ matrix.target }}.tar.gz.pem \
            germinate-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: packages/rust/target/${{ matrix.target }}/release/germinate-*

  github-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    environment: release        # <- gate: requires manual approval in the maintainer's repo settings
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create GitHub Release with signed assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  npm-publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    environment: release        # <- same manual-approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish with provenance (OIDC-signed supply chain)
        run: cd packages/node && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
