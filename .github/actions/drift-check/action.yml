name: "handoff-ledger drift-check"
description: "Fail the build if any projection is STALE / OUT_OF_SYNC / MISSING vs the docset. Tier-2 team gate."
inputs:
  manifest:
    description: "Path to the manifest.json"
    required: false
    default: "manifest.json"
  serializability:
    description: "Also run the serializability check in --strict mode"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install handoff-ledger
      shell: bash
      run: npm install -g handoff-ledger
    - name: drift-check
      shell: bash
      run: handoff-ledger drift-check --manifest "${{ inputs.manifest }}"
    - name: serializability (optional)
      if: ${{ inputs.serializability == 'true' }}
      shell: bash
      run: handoff-ledger serializability --strict --manifest "${{ inputs.manifest }}"
